apiVersion: v1
kind: ConfigMap
metadata:
  name: mas-mcp-config
  namespace: mas-mcp-server
data:
  MAS_MCP_ENV: "prod"
  MAS_MCP_API_BASE_PATH: "/api"
  MAS_MCP_CORS_ALLOW_ORIGINS: "*"
  MAS_MCP_OTEL_SERVICE_NAME: "mas-mcp-server"
---
apiVersion: v1
kind: Secret
metadata:
  name: mas-mcp-secrets
  namespace: mas-mcp-server
type: Opaque
stringData:
  MAS_MCP_JWT_SECRET: "CHANGE_ME"
  MAS_MCP_DATABASE_URL: "postgresql+psycopg2://masmcp:masmcp@postgres:5432/masmcp"
  POSTGRES_USER: "masmcp"
  POSTGRES_PASSWORD: "masmcp"
  POSTGRES_DB: "masmcp"
